<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StoryVerse Admin Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    color:#fff;
    padding:18px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header-content{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.admin-email{
    font-size:13px;
    opacity:.9;
    margin-top:4px;
}

.logout-btn{
    border:none;
    background:#fff;
    color:#2575fc;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    width:95%;
    max-width:1200px;
    margin:20px auto;
}

.login-box{
    max-width:420px;
    margin:70px auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.login-box h2{
    text-align:center;
    margin-bottom:10px;
    color:#2575fc;
}

.login-box p{
    text-align:center;
    color:#777;
    margin-bottom:18px;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

input:focus{
    border-color:#2575fc;
}

.primary-btn{
    width:100%;
    border:none;
    padding:13px;
    border-radius:8px;
    background:#2575fc;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.primary-btn:disabled{
    opacity:.6;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:8px;
    display:none;
    text-align:center;
}

.error{
    background:#ffe5e5;
    color:#c00;
}

.success{
    background:#e5ffe9;
    color:#087522;
}

.dashboard{
    display:none;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h3{
    font-size:14px;
    color:#777;
    margin-bottom:8px;
}

.card strong{
    font-size:25px;
    color:#2575fc;
}

.section{
    background:#fff;
    padding:18px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.section-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.top-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.search-box{
    margin-bottom:15px;
}

.user-card{
    border:1px solid #e5e5e5;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
}

.user-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.user-name{
    font-size:18px;
    font-weight:bold;
}

.user-email{
    color:#666;
    font-size:14px;
    word-break:break-word;
    margin-top:4px;
}

.user-info{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin-top:10px;
}

.info{
    background:#f5f7fa;
    padding:10px;
    border-radius:8px;
}

.info small{
    display:block;
    color:#777;
    margin-bottom:4px;
}

.info strong{
    word-break:break-word;
}

.delete-btn{
    border:none;
    background:#dc3545;
    color:#fff;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.delete-btn:disabled{
    opacity:.6;
}

.refresh-btn{
    border:none;
    background:#198754;
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

@media(max-width:600px){

    .header-content{
        align-items:flex-start;
    }

    .logo{
        font-size:17px;
    }

    .logout-btn{
        padding:8px 10px;
    }

    .user-top{
        flex-direction:column;
        align-items:flex-start;
    }

    .delete-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header id="mainHeader" style="display:none;">

    <div class="header-content">

        <div>
            <div class="logo">
                StoryVerse Admin
            </div>

            <div
                class="admin-email"
                id="adminEmail"
            >
                Administrator
            </div>
        </div>

        <button
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </div>

</header>


<!-- ================= LOGIN ================= -->

<div id="loginSection">

    <div class="login-box">

        <h2>StoryVerse Admin</h2>

        <p>
            Administrator Login
        </p>

        <input
            type="email"
            id="loginEmail"
            placeholder="Admin email"
            autocomplete="email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Admin password"
            autocomplete="current-password"
        >

        <button
            class="primary-btn"
            id="loginBtn"
        >
            Login
        </button>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </div>

</div>


<!-- ================= DASHBOARD ================= -->

<div
    class="dashboard"
    id="dashboard"
>

    <div class="container">

        <!-- STATISTICS -->

        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <strong id="totalUsers">0</strong>
            </div>

            <div class="card">
                <h3>Users With Balance</h3>
                <strong id="usersWithBalance">0</strong>
            </div>

            <div class="card">
                <h3>Total Balance</h3>
                <strong id="totalBalance">₦0</strong>
            </div>

        </div>


        <!-- USERS -->

        <div class="section">

            <div class="top-row">

                <div class="section-title">
                    Registered Users
                </div>

                <button
                    class="refresh-btn"
                    id="refreshBtn"
                >
                    🔄 Refresh
                </button>

            </div>


            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search name, email, UID or referral ID..."
                >

            </div>


            <div id="usersContainer">

                <div class="loading">
                    Loading users...
                </div>

            </div>

        </div>

    </div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
    getFunctions,
    httpsCallable
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-functions.js";


/* =====================================================
   YOUR FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAkDGP6ML77vHL9dmt4iZChaKg-7fbMceE",

    authDomain:
        "story-verse-earnig.firebaseapp.com",

    databaseURL:
        "https://story-verse-earnig-default-rtdb.firebaseio.com",

    projectId:
        "story-verse-earnig",

    storageBucket:
        "story-verse-earnig.firebasestorage.app",

    messagingSenderId:
        "650131396615",

    appId:
        "1:650131396615:web:ad655e6412de909d8db2a2",

    measurementId:
        "G-ZLQ6G156LX"
};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const functions =
    getFunctions(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loginSection =
    document.getElementById("loginSection");

const dashboard =
    document.getElementById("dashboard");

const mainHeader =
    document.getElementById("mainHeader");

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const refreshBtn =
    document.getElementById("refreshBtn");

const loginMessage =
    document.getElementById("loginMessage");

const usersContainer =
    document.getElementById("usersContainer");

const searchInput =
    document.getElementById("searchInput");

const totalUsers =
    document.getElementById("totalUsers");

const usersWithBalance =
    document.getElementById("usersWithBalance");

const totalBalance =
    document.getElementById("totalBalance");

const adminEmail =
    document.getElementById("adminEmail");


let allUsers = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    element,
    text,
    type
){

    element.textContent = text;

    element.className =
        "message " + type;

    element.style.display =
        "block";
}


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(
    "click",
    async () => {

        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
            document
            .getElementById("loginPassword")
            .value;


        if(!email || !password){

            showMessage(
                loginMessage,
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        loginBtn.disabled =
            true;

        loginBtn.textContent =
            "Logging in...";


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }catch(error){

            console.error(error);

            showMessage(
                loginMessage,
                getFirebaseError(error),
                "error"
            );

        }


        loginBtn.disabled =
            false;

        loginBtn.textContent =
            "Login";

    }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async (user) => {

        if(user){

            try{

                /*
                 * Refresh token so Firebase receives
                 * the latest admin custom claim.
                 */

                await user.getIdToken(true);

            }catch(error){

                console.error(error);

            }


            loginSection.style.display =
                "none";

            dashboard.style.display =
                "block";

            mainHeader.style.display =
                "block";

            adminEmail.textContent =
                user.email ||
                "Administrator";


            await loadUsers();

        }else{

            loginSection.style.display =
                "block";

            dashboard.style.display =
                "none";

            mainHeader.style.display =
                "none";

        }

    }
);


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

    usersContainer.innerHTML = `
        <div class="loading">
            Loading users...
        </div>
    `;


    try{

        const snapshot =
            await getDocs(
                collection(db, "users")
            );


        allUsers = [];


        snapshot.forEach(
            (doc) => {

                allUsers.push({

                    uid: doc.id,

                    ...doc.data()

                });

            }
        );


        updateStatistics();

        renderUsers(
            getFilteredUsers()
        );


    }catch(error){

        console.error(
            "Loading users error:",
            error
        );


        usersContainer.innerHTML = `
            <div class="empty">
                ❌ Unable to load users.
                <br><br>
                ${escapeHTML(error.message)}
            </div>
        `;

    }

}


/* =====================================================
   STATISTICS
===================================================== */

function updateStatistics(){

    totalUsers.textContent =
        allUsers.length;


    let balanceTotal = 0;

    let usersBalance = 0;


    allUsers.forEach(
        user => {

            const balance =
                Number(
                    user.balance ??
                    user.earningBalance ??
                    user.walletBalance ??
                    0
                );


            if(balance > 0){

                usersBalance++;

            }


            balanceTotal +=
                balance;

        }
    );


    usersWithBalance.textContent =
        usersBalance;


    totalBalance.textContent =
        formatNaira(balanceTotal);

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(users){

    if(!users.length){

        usersContainer.innerHTML = `
            <div class="empty">
                No users found.
            </div>
        `;

        return;
    }


    usersContainer.innerHTML =
        "";


    users.forEach(
        user => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "user-card";


            const name =
                user.name ||
                user.fullName ||
                user.username ||
                "No name";


            const email =
                user.email ||
                "No email";


            const balance =
                Number(
                    user.balance ??
                    user.earningBalance ??
                    user.walletBalance ??
                    0
                );


            const referralId =
                user.referralId ||
                user.referralCode ||
                user.referral ||
                "N/A";


            const referrals =
                user.referrals ||
                user.referralCount ||
                0;


            card.innerHTML = `

                <div class="user-top">

                    <div>

                        <div class="user-name">
                            ${escapeHTML(name)}
                        </div>

                        <div class="user-email">
                            ${escapeHTML(email)}
                        </div>

                    </div>


                    <button
                        class="delete-btn"
                        data-uid="${escapeHTML(user.uid)}"
                        data-name="${escapeHTML(name)}"
                    >
                        🗑️ Delete User
                    </button>

                </div>


                <div class="user-info">

                    <div class="info">

                        <small>User UID</small>

                        <strong>
                            ${escapeHTML(user.uid)}
                        </strong>

                    </div>


                    <div class="info">

                        <small>Balance</small>

                        <strong>
                            ${formatNaira(balance)}
                        </strong>

                    </div>


                    <div class="info">

                        <small>Referral ID</small>

                        <strong>
                            ${escapeHTML(referralId)}
                        </strong>

                    </div>


                    <div class="info">

                        <small>Referrals</small>

                        <strong>
                            ${escapeHTML(referrals)}
                        </strong>

                    </div>

                </div>

            `;


            usersContainer.appendChild(card);

        }
    );


    document
        .querySelectorAll(".delete-btn")
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        deleteUserAccount(
                            button.dataset.uid,
                            button.dataset.name,
                            button
                        );

                    }
                );

            }
        );

}


/* =====================================================
   DELETE USER
===================================================== */

async function deleteUserAccount(
    uid,
    name,
    button
){

    if(!uid){

        alert(
            "❌ User UID was not found."
        );

        return;
    }


    const confirmed =
        confirm(

            "⚠️ DELETE USER\n\n" +

            "User: " +
            name +
            "\n\n" +

            "This will permanently delete:\n" +

            "• Firebase Authentication account\n" +

            "• users/" +
            uid +
            "\n" +

            "• Firestore subcollections under the user\n\n" +

            "This action cannot be undone.\n\n" +

            "Continue?"

        );


    if(!confirmed){

        return;
    }


    button.disabled =
        true;

    button.textContent =
        "Deleting...";


    try{

        /*
         * Secure Cloud Function
         */

        const deleteUser =
            httpsCallable(
                functions,
                "deleteUser"
            );


        const result =
            await deleteUser({

                uid: uid

            });


        console.log(
            "Delete result:",
            result.data
        );


        alert(
            "✅ User deleted successfully."
        );


        /*
         * Remove deleted user from
         * the current admin list.
         */

        allUsers =
            allUsers.filter(
                user =>
                    user.uid !== uid
            );


        updateStatistics();

        renderUsers(
            getFilteredUsers()
        );


    }catch(error){

        console.error(
            "Delete user error:",
            error
        );


        let message =
            "Unable to delete user.";


        if(
            error.code ===
            "functions/permission-denied"
        ){

            message =
                "❌ You are not authorized to delete users.";

        }

        else if(
            error.code ===
            "functions/unauthenticated"
        ){

            message =
                "❌ Your administrator session has expired. Please log in again.";

        }

        else if(
            error.code ===
            "functions/failed-precondition"
        ){

            message =
                "❌ You cannot delete the administrator account you are currently using.";

        }

        else if(error.message){

            message =
                "❌ " +
                error.message;

        }


        alert(message);


        button.disabled =
            false;

        button.textContent =
            "🗑️ Delete User";

    }

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    () => {

        renderUsers(
            getFilteredUsers()
        );

    }
);


function getFilteredUsers(){

    const search =
        searchInput
        .value
        .trim()
        .toLowerCase();


    if(!search){

        return allUsers;

    }


    return allUsers.filter(
        user => {

            const values = [

                user.uid,
                user.name,
                user.fullName,
                user.username,
                user.email,
                user.referralId,
                user.referralCode,
                user.referral

            ];


            return values.some(
                value =>

                    String(value || "")
                    .toLowerCase()
                    .includes(search)

            );

        }
    );

}


/* =====================================================
   REFRESH
===================================================== */

refreshBtn.addEventListener(
    "click",
    async () => {

        refreshBtn.disabled =
            true;

        refreshBtn.textContent =
            "Refreshing...";


        await loadUsers();


        refreshBtn.disabled =
            false;

        refreshBtn.textContent =
            "🔄 Refresh";

    }
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

        }catch(error){

            console.error(error);

        }

    }
);


/* =====================================================
   NAIRA FORMAT
===================================================== */

function formatNaira(amount){

    return "₦" +
        Number(amount || 0)
        .toLocaleString(
            "en-NG",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   FIREBASE LOGIN ERRORS
===================================================== */

function getFirebaseError(error){

    switch(error.code){

        case "auth/invalid-credential":
            return "❌ Incorrect email or password.";

        case "auth/invalid-email":
            return "❌ Invalid email address.";

        case "auth/user-disabled":
            return "❌ This account has been disabled.";

        case "auth/too-many-requests":
            return "❌ Too many login attempts. Try again later.";

        default:

            return "❌ " +
                (
                    error.message ||
                    "Login failed."
                );

    }

}

</script>

</body>
  </html>
